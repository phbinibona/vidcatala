name: Assemble Emporda song MP4
on:
  push:
    branches:
      - vidcatala-current
    paths:
      - 'assets/.emporda-transfer/**'
permissions:
  contents: write
jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vidcatala-current
          persist-credentials: true
      - name: Rebuild original MP4 and commit it
        shell: bash
        run: |
          set -euo pipefail
          cat assets/.emporda-transfer/part*.b64 | base64 --decode > assets/emporda.mp4
          test "$(stat -c %s assets/emporda.mp4)" = "9847283"
          test "$(git hash-object assets/emporda.mp4)" = "b9942367f1f8da9758999a366510c3bf65aa917e"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/emporda.mp4
          git rm -r assets/.emporda-transfer
          git commit -m "Upload Emporda MP4 video to VidCatala"
          git push origin HEAD:vidcatala-current
